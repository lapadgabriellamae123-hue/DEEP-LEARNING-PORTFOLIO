# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: My Data Science Portfolio
author: Gabriella Mae Lapad
logo: ""

# Force re-execution of notebooks on each build?
# See https://jupyterbook.org/content/execute.html
execute:
  # 'off' = use the outputs already saved inside each .ipynb file.
  # Recommended here since some notebooks (lab4-lab6) need PyTorch,
  # which the Jupyter Book build environment may not have installed.
  # Run those notebooks yourself first (with outputs), save them, THEN build.
  execute_notebooks: 'off'

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file if you need citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://lapadgabriellamae123-hue.github.io/DEEP-LEARNING-PORTFOLIO/
  branch: main

# Add GitHub buttons to your book
html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: false
  extra_navbar: "Built with Jupyter Book"
